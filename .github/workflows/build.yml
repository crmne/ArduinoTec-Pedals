name: Test, build and package

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Firmware behavior and EEPROM interruption tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -Itests/stubs tests/pedals_test.cpp -o /tmp/pedals-test
          /tmp/pedals-test
      - name: Setup tool tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: '1.5.1'
      - name: Build all three board profiles and package sources
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python tools/build.py --setup --release-tag "$REF_NAME" --default-branch "$DEFAULT_BRANCH"
          else
            python tools/build.py --setup
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pedals-firmware
          path: build/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pedals-firmware
          path: dist
      - name: Prepare release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Download the pedals ZIP for firmware, installation instructions and the calibration tool. Select the HEX matching your board. The source archive includes the firmware, tools, libraries and board cores; SHA256SUMS covers the assets.

          Calibration is required after installing this firmware for the first time. Read README.md before wiring or flashing. CI validates software behavior and builds; check the hardware validation notes before publishing this release.
          NOTES
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "ArduinoTec-Pedals $RELEASE_TAG" --notes-file release-notes.md dist/*
